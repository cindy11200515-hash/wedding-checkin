<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進階宴會桌位排定系統</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --main-table-color: #b81d24;
            --normal-table-color: #e67e22;
            --bg-color: #f5f7fa;
        }

        * {
            box-sizing: border-box;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        /* 左側控制面板 */
        #sidebar {
            width: 320px;
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }

        h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        /* 功能按鈕區 */
        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #357abd;
        }

        .guest-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .guest-item {
            background: #f0f4f8;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: grab;
            border-left: 5px solid var(--primary-color);
            font-size: 14px;
            user-select: none;
        }

        /* 右側自由移動畫布區 */
        #canvas {
            flex: 1;
            position: relative;
            background-color: #e5e9f0;
            /* 模擬宴會廳地毯格線 */
            background-image: linear-gradient(#d8dee9 1px, transparent 1px), linear-gradient(90deg, #d8dee9 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: auto;
        }

        /* 桌椅整體的動態容器 */
        .table-container {
            position: absolute; /* 關鍵：允許透過 JS 改變 top/left */
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: move; /* 滑鼠移上去顯示可移動圖示 */
            user-select: none;
        }

        /* 圓桌本體 */
        .table-center {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 2;
            pointer-events: none; /* 讓滑鼠事件穿透給父容器處理拖拉 */
        }

        .main-table { background-color: var(--main-table-color); }
        .normal-table { background-color: var(--normal-table-color); }

        /* 桌子下方的刪除按鈕 */
        .delete-table-btn {
            font-size: 11px;
            background: rgba(0,0,0,0.3);
            border: none;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            cursor: pointer;
            pointer-events: auto; /* 恢復點擊事件 */
        }
        .delete-table-btn:hover { background: #ff4d4d; }

        /* 座位 */
        .seat {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            border: 2px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: #999;
            transition: background 0.2s, transform 0.2s;
            z-index: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
        }

        .seat.occupied {
            border: 2px solid var(--primary-color);
            background: #eef5fc;
            color: #333;
            font-weight: 500;
        }

        .seat.drag-over {
            background: #d4e6f7;
            border-color: var(--primary-color);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>宴會控制台</h3>
        <div class="controls">
            <button class="btn" onclick="addTable('main')">+ 新增主桌 (10人)</button>
            <button class="btn" onclick="addTable('normal')">+ 新增客桌 (8人)</button>
        </div>
        
        <h3>未分配賓客</h3>
        <div class="guest-list" id="guestList"></div>
    </div>

    <div id="canvas"></div>

    <script>
        // 1. 初始化資料
        const guests = [
            { id: "g1", name: "王大明" }, { id: "g2", name: "陳小美" },
            { id: "g3", name: "張三峰" }, { id: "g4", name: "李四端" },
            { id: "g5", name: "林心如" }, { id: "g6", name: "趙又廷" },
            { id: "g7", name: "許瑋甯" }, { id: "g8", name: "彭于晏" }
        ];

        // 初始只有兩張桌子，給定初始 X, Y 座標
        const tables = [
            { id: "t_1", name: "主桌", type: "main", seatCount: 10, x: 50, y: 50 },
            { id: "t_2", name: "客桌 1", type: "normal", seatCount: 8, x: 400, y: 50 }
        ];

        let draggedGuestId = null;
        let tableCounter = 1; // 用於計算客桌編號

        // 2. 初始化啟動
        function init() {
            renderGuests();
            renderTables();
        }

        // 3. 動態新增桌子功能
        function addTable(type) {
            const id = 't_' + Date.now();
            let name = "";
            let seatCount = 8;

            if (type === 'main') {
                name = "主桌";
                seatCount = 10;
            } else {
                tableCounter++;
                name = `客桌 ${tableCounter}`;
                seatCount = 8;
            }

            // 新增桌子資料，預設出現在畫布中央靠左 (100, 200)
            tables.push({
                id: id,
                name: name,
                type: type,
                seatCount: seatCount,
                x: 100 + (tables.length * 20), // 錯開位置避免重疊
                y: 200
            });

            renderTables();
        }

        // 刪除桌子
        function deleteTable(tableId) {
            const index = tables.findIndex(t => t.id === tableId);
            if (index !== -1) {
                // 檢查桌上是否有人，把人退回名單
                const container = document.querySelector(`[data-id="${tableId}"]`);
                const occupiedSeats = container.querySelectorAll('.seat.occupied');
                occupiedSeats.forEach(seat => {
                    guests.push({ id: 'g_' + Date.now() + Math.random(), name: seat.innerText });
                });

                tables.splice(index, 1);
                renderTables();
                renderGuests();
            }
        }

        // 4. 渲染左側名單
        function renderGuests() {
            const listEl = document.getElementById('guestList');
            listEl.innerHTML = '';
            guests.forEach(guest => {
                const item = document.createElement('div');
                item.className = 'guest-item';
                item.draggable = true;
                item.innerText = guest.name;

                item.addEventListener('dragstart', (e) => {
                    draggedGuestId = guest.id;
                    e.dataTransfer.setData('text/plain', guest.id);
                });

                listEl.appendChild(item);
            });
        }

        // 5. 渲染右側畫布（包含桌子拖拉物理邏輯）
        function renderTables() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';

            tables.forEach(table => {
                const container = document.createElement('div');
                container.className = 'table-container';
                container.dataset.id = table.id;
                // 設定動態座標
                container.style.left = table.x + 'px';
                container.style.top = table.y + 'px';

                // 建立中央圓桌與刪除按鈕
                const center = document.createElement('div');
                center.className = `table-center ${table.type === 'main' ? 'main-table' : 'normal-table'}`;
                
                const titleSpan = document.createElement('span');
                titleSpan.innerText = table.name;
                center.appendChild(titleSpan);

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-table-btn';
                delBtn.innerText = '刪除';
                delBtn.onclick = (e) => {
                    e.stopPropagation(); // 防止觸發拖拉
                    deleteTable(table.id);
                };
                center.appendChild(delBtn);
                
                container.appendChild(center);

                // 計算座位幾何環繞
                const radius = 95; 
                const totalSeats = table.seatCount;

                for (let i = 0; i < totalSeats; i++) {
                    const seat = document.createElement('div');
                    seat.className = 'seat';
                    seat.innerText = '空';
                    
                    const angle = (i * 2 * Math.PI / totalSeats) - (Math.PI / 2);
                    const x = 150 + radius * Math.cos(angle) - 25;
                    const y = 150 + radius * Math.sin(angle) - 25;

                    seat.style.left = `${x}px`;
                    seat.style.top = `${y}px`;

                    setupSeatEvents(seat);
                    container.appendChild(seat);
                }

                // 【核心功能】使桌子可以被滑鼠拖拉移動位置
                makeTableDraggable(container, table);

                canvas.appendChild(container);
            });
        }

        // 6. 桌子自由拖拉演算法
        function makeTableDraggable(el, tableData) {
            let isDragging = false;
            let startX, startY;

            el.addEventListener('mousedown', (e) => {
                // 如果點擊的是座位或刪除按鈕，不發動桌子拖拉
                if (e.target.classList.contains('seat') || e.target.classList.contains('delete-table-btn')) return;

                isDragging = true;
                // 計算滑鼠點擊點與桌子左上角的相對距離
                startX = e.clientX - el.offsetLeft;
                startY = e.clientY - el.offsetTop;
                el.style.zIndex = 5; // 拖動中的桌子顯示在最上層
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                // 計算桌子新位置
                let newX = e.clientX - startX;
                let newY = e.clientY - startY;

                // 限制不能拖出畫布左方和上方
                if (newX < 0) newX = 0;
                if (newY < 0) newY = 0;

                // 更新 DOM 視覺位置
                el.style.left = newX + 'px';
                el.style.top = newY + 'px';

                // 同步將新位置寫回資料庫(陣列)中保存
                tableData.x = newX;
                tableData.y = newY;
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    el.style.zIndex = 1;
                }
            });
        }

        // 7. 處理座位拖放賓客邏輯
        function setupSeatEvents(seat) {
            seat.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (!seat.classList.contains('occupied')) seat.classList.add('drag-over');
            });

            seat.addEventListener('dragleave', () => seat.classList.remove('drag-over'));

            seat.addEventListener('drop', (e) => {
                e.preventDefault();
                seat.classList.remove('drag-over');
                if (seat.classList.contains('occupied')) return;

                const guestId = e.dataTransfer.getData('text/plain');
                const guestIndex = guests.findIndex(g => g.id === guestId);
                
                if (guestIndex !== -1) {
                    seat.innerText = guests[guestIndex].name;
                    seat.classList.add('occupied');
                    guests.splice(guestIndex, 1);
                    renderGuests();
                }
            });

            // 點擊退席
            seat.addEventListener('click', (e) => {
                e.stopPropagation(); // 阻止事件傳給桌子觸發點擊移動
                if (seat.classList.contains('occupied')) {
                    guests.push({ id: 'g_' + Date.now(), name: seat.innerText });
                    seat.innerText = '空';
                    seat.classList.remove('occupied');
                    renderGuests();
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
