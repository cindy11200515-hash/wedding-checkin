<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸福婚宴 - 賓客報到系統</title>
    <style>
        :root {
            --primary-color: #d63447;
            --bg-color: #f6ecd6;
            --card-bg: #ffffff;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: var(--primary-color); margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .counter-section {
            margin: 20px 0;
            padding: 15px;
            background: #fff9f9;
            border-radius: 8px;
            border: 1px solid #ffbcbc;
        }
        .counter-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }
        .counter-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--primary-color);
            background: white;
            color: var(--primary-color);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .counter-value { font-size: 24px; font-weight: bold; min-width: 40px; }
        .result-box {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background-color: #fff5f5;
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
        }
        .table-number { font-size: 32px; font-weight: bold; color: var(--primary-color); margin: 10px 0; }
        .map-img { width: 100%; max-width: 350px; margin-top: 15px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .loading { display: none; color: #666; margin-top: 15px; font-weight: bold; }
        .init-loading { color: #d63447; font-size: 14px; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>歡迎光臨我們的婚宴</h2>
    <div class="subtitle">請輸入您的姓名以確認桌位並完成報到</div>
    
    <div id="init-msg" class="init-loading">正在連線雲端資料庫，請稍候...</div>

    <div id="search-section">
        <div class="form-group">
            <label for="guest-name">賓客姓名</label>
            <input type="text" id="guest-name" placeholder="請輸入您的姓名" autocomplete="off" disabled>
        </div>
        <button id="search-btn" onclick="searchGuest()" disabled>請稍候...</button>
    </div>

    <div id="confirm-section" style="display: none; text-align: left;">
        <h3 style="color: #333; margin-top: 0;" id="welcome-title"></h3>
        <p>您的預排座位在：<strong style="color: var(--primary-color); font-size: 18px;" id="welcome-table"></strong></p>
        
        <div class="counter-section">
            <label style="margin-bottom: 2px; font-weight: bold;">請確認今日「實際到場人數」：</label>
            <div class="counter-box">
                <div class="counter-btn" onclick="changeCount(-1)">-</div>
                <div class="counter-value" id="actual-count-val">1</div>
                <div class="counter-btn" onclick="changeCount(1)">+</div>
            </div>
            <div id="table-limit-hint" style="color:#d63447; font-size:12px; margin-top:8px; display:none; text-align:center; font-weight:bold;">⚠️ 注意：該桌實到人數已達或接近 12 人上限！</div>
        </div>
        <button onclick="finalCheckIn()" style="background-color: #2b8a3e;">確認報到入座</button>
    </div>
    
    <div id="loading-msg" class="loading">正在傳送報到資料，請稍候...</div>
    <div id="result-section" class="result-box"></div>
</div>

<script>
// ⚠️ 請在下方雙引號內，貼上你在 Google Apps Script 取得的最新部署網址
const API_URL = "https://script.google.com/macros/s/AKfycbzcNdYRPaYInARPzy-lCOilwcFD_HWhuU8Ir16-1rIZxCLD5fMwSDFae_XDLv3HhOfK/exec";

// 本地記憶體暫存變數
let globalGuestDatabase = [];
let globalRecords = [];

let currentGuest = null;
let currentActualCount = 1;
let currentTableTotalActual = 0; // 該桌目前已報到的總人數

// 🚀 核心優化：網頁一打開，立刻在背景偷偷下載所有名單與紀錄
async function initSystem() {
    try {
        // 同步並行抓取兩個資料庫，節省時間
        const [resGuests, resRecords] = await Promise.all([
            fetch(`${API_URL}?action=getGuests`),
            fetch(`${API_URL}?action=getRecords`)
        ]);
        
        globalGuestDatabase = await resGuests.json();
        globalRecords = await resRecords.json();
        
        // 下載完成，解鎖輸入框與按鈕
        document.getElementById("init-msg").style.display = "none";
        document.getElementById("guest-name").disabled = false;
        document.getElementById("search-btn").disabled = false;
        document.getElementById("search-btn").innerText = "查詢資料";
    } catch (err) {
        document.getElementById("init-msg").innerText = "⚠️ 網路連線失敗，請重新整理網頁！";
        console.error(err);
    }
}

// ⚡ 零延遲秒查功能
function searchGuest() {
    const inputName = document.getElementById("guest-name").value.trim();
    const resultSection = document.getElementById("result-section");
    const confirmSection = document.getElementById("confirm-section");
    const searchSection = document.getElementById("search-section");
    
    if (!inputName) { alert("請輸入姓名！"); return; }
    
    resultSection.style.display = "none";
    confirmSection.style.display = "none";

    // 1. 於記憶體中秒查：這個人是不是「已經報到過」了
    const checkedInRecord = globalRecords.find(r => r.name === inputName);

    if (checkedInRecord) {
        // 如果已經報到過，直接秒秀座位圖
        let mapImageName = `${checkedInRecord.table}.jpg`;
        resultSection.innerHTML = `
            <h3 style="color: #1c7ed6; margin-top:0;">您先前已完成報到囉！</h3>
            <p><strong>${checkedInRecord.name}</strong> 的座位在：</p>
            <div class="table-number">${checkedInRecord.table}</div>
            <p>已登記到場人數：<strong>${checkedInRecord.actualCount} 人</strong></p>
            <p style="font-weight:bold; margin-top:15px; color:#333;">📍 宴席座位指引圖：</p>
            <img class="map-img" src="${mapImageName}" onerror="this.src='default.jpg'; this.onerror=null;" alt="座位位置圖">
            <p style="font-size:13px; color:#888; margin-top:10px;">歡迎直接入座，祝您用餐愉快！</p>
        `;
        resultSection.style.display = "block";
        return; 
    }

    // 2. 如果還沒報到，於記憶體中秒查總名單
    const guest = globalGuestDatabase.find(g => g.name === inputName);

    if (guest) {
        currentGuest = guest;
        currentActualCount = guest.count; // 預設帶入預估人數
        
        // 秒算該桌現場「其他已經報到的人」總數
        currentTableTotalActual = globalRecords
            .filter(r => r.table === guest.table)
            .reduce((sum, r) => sum + (parseInt(r.actualCount) || 0), 0);

        document.getElementById("welcome-title").innerText = `${guest.name} 您好！`;
        document.getElementById("welcome-table").innerText = guest.table;
        document.getElementById("actual-count-val").innerText = currentActualCount;
        
        checkTableLimit();

        searchSection.style.display = "none";
        confirmSection.style.display = "block";
    } else {
        resultSection.innerHTML = `
            <p style="color:#b32121; font-weight:bold;">找不到您的名單資料</p>
            <p style="font-size: 14px; color:#555;">請確認姓名是否正確，或洽詢現場招待人員協助。</p>
        `;
        resultSection.style.display = "block";
    }
}

function changeCount(delta) {
    let targetCount = currentActualCount + delta;
    if (targetCount < 1) targetCount = 1; 
    
    if (currentTableTotalActual + targetCount > 12 && delta > 0) {
        alert(`提醒：加上這人數後，【${currentGuest.table}】總人數將達到 ${currentTableTotalActual + targetCount} 人，已超過每桌 12 人上限，請向招待人員確認是否有調桌需求！`);
    }
    
    currentActualCount = targetCount;
    document.getElementById("actual-count-val").innerText = currentActualCount;
    checkTableLimit();
}

function checkTableLimit() {
    const hint = document.getElementById("table-limit-hint");
    if (currentTableTotalActual + currentActualCount >= 12) {
        hint.style.display = "block";
    } else {
        hint.style.display = "none";
    }
}

// 寫入報到資料（只有這裡會耗費連線時間）
async function finalCheckIn() {
    const confirmSection = document.getElementById("confirm-section");
    const resultSection = document.getElementById("result-section");
    const loadingMsg = document.getElementById("loading-msg");
    
    confirmSection.style.display = "none";
    loadingMsg.style.display = "block";

    try {
        // 乾淨的 24 小時制時間產生 (時:分:秒)
        let now = new Date();
        let timeStr = [now.getHours(), now.getMinutes(), now.getSeconds()].map(v => v < 10 ? '0' + v : v).join(':');

        // 送出 POST 請求寫入 Google 試算表
        await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "checkIn",
                time: timeStr,
                name: currentGuest.name,
                table: currentGuest.table,
                expectedCount: currentGuest.count,
                actualCount: currentActualCount
            })
        });

        // 顯示專屬座位指引圖檔名
        let mapImageName = `${currentGuest.table}.jpg`;

        resultSection.innerHTML = `
            <h3 style="color: #2e7d32; margin-top:0;">恭喜！報到成功</h3>
            <p><strong>${currentGuest.name}</strong> 歡迎入座，您的桌位：</p>
            <div class="table-number">${currentGuest.table}</div>
            <p>今日到場人數：<strong>${currentActualCount} 人</strong></p>
            <p style="font-weight:bold; margin-top:15px; color:#333;">📍 宴席座位指引圖：</p>
            <img class="map-img" src="${mapImageName}" onerror="this.src='default.jpg'; this.onerror=null;" alt="座位位置圖">
            <p style="font-size:13px; color:#888; margin-top:10px;">歡迎入座，祝您用餐愉快！</p>
        `;
        resultSection.style.display = "block";
    } catch (err) {
        alert("寫入失敗，請稍後再試！");
        confirmSection.style.display = "block";
    } finally {
        loadingMsg.style.display = "none";
    }
}

// 網頁一打開，立刻發動「背景秘密預載入」
window.onload = initSystem;
</script>

</body>
</html>
