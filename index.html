<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸福婚宴 - 賓客報到系統</title>
    <style>
        :root { --primary-color: #d63447; --bg-color: #f6ecd6; --card-bg: #ffffff; }
        body { font-family: Arial, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: var(--primary-color); margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { background-color: var(--primary-color); color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .result-box { display: none; margin-top: 24px; padding: 20px; background-color: #fff5f5; border: 2px dashed var(--primary-color); border-radius: 8px; }
        .table-number { font-size: 32px; font-weight: bold; color: var(--primary-color); margin: 10px 0; }
        .loading { display:none; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h2>歡迎光臨我們的婚宴</h2>
    <div class="subtitle">請輸入您的姓名以確認桌位並完成報到</div>
    <div class="form-group">
        <label for="guest-name">賓客姓名</label>
        <input type="text" id="guest-name" placeholder="請輸入您的姓名" autocomplete="off">
    </div>
    <button onclick="handleCheckIn()">確認報到</button>
    <div id="loading-msg" class="loading">正在連線雲端資料庫，請稍候...</div>
    <div id="result-section" class="result-box"></div>
</div>

<script>
// ⚠️ 請在此處貼上你在第二步取得的 Google Apps Script 網頁應用程式 URL
const API_URL = https://script.google.com/macros/s/AKfycbyhAzY2dKOY7NU1RfPGQDj4voMEGlWtG3f4IsMT8ocW4lwNYgugKOyucrPShYCRUZ6J8A/exec;

async function handleCheckIn() {
    const inputName = document.getElementById("guest-name").value.trim();
    const resultSection = document.getElementById("result-section");
    const loadingMsg = document.getElementById("loading-msg");
    
    if (!inputName) { alert("請輸入姓名！"); return; }
    
    loadingMsg.style.display = "block";
    resultSection.style.display = "none";

    try {
        // 從雲端試算表撈取總名單
        let response = await fetch(`${API_URL}?action=getGuests`);
        let guestDatabase = await response.json();
        
        const guest = guestDatabase.find(g => g.name === inputName);

        if (guest) {
            // 向雲端寫入一筆報到紀錄
            let timeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false });
            await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "checkIn",
                    time: timeStr,
                    name: guest.name,
                    table: guest.table,
                    count: guest.count
                })
            });

            resultSection.innerHTML = `
                <h3 style="color: #2e7d32; margin-top:0;">恭喜！報到成功</h3>
                <p><strong>${guest.name}</strong> 您好，您的桌位在：</p>
                <div class="table-number">${guest.table}</div>
                <p>出席人數：<strong>${guest.count} 人</strong></p>
            `;
        } else {
            resultSection.innerHTML = `<p style="color:#b32121; font-weight:bold;">找不到您的名單資料</p><p style="font-size:13px;">請確認姓名是否正確，或洽詢現場招待。</p>`;
        }
        resultSection.style.display = "block";
    } catch (err) {
        alert("連線失敗，請檢查網路連線！");
    } finally {
        loadingMsg.style.display = "none";
    }
}
</script>
</body>
</html>
