<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宴會桌位排定系統</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --main-table-color: #b81d24;
            --normal-table-color: #e67e22;
            --bg-color: #f5f7fa;
        }

        * {
            box-sizing: border-box;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
        }

        /* 左側賓客管理區 */
        #sidebar {
            width: 300px;
            background: white;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }

        h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .guest-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .guest-item {
            background: #f0f4f8;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: grab;
            border-left: 5px solid var(--primary-color);
            font-size: 14px;
            transition: transform 0.1s;
            user-select: none;
        }

        .guest-item:active {
            cursor: grabbing;
        }

        /* 右側畫布區 */
        #canvas {
            flex: 1;
            position: relative;
            overflow: auto;
            padding: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 100px;
            justify-content: center;
            align-content: flex-start;
        }

        /* 桌子與座位的容器 */
        .table-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 圓桌本體 */
        .table-center {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 2;
        }

        .main-table { background-color: var(--main-table-color); }
        .normal-table { background-color: var(--normal-table-color); }

        /* 座位（環繞在桌子周圍） */
        .seat {
            position: absolute;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: white;
            border: 2px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: #999;
            transition: all 0.2s;
            z-index: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* 當座位有人的時候 */
        .seat.occupied {
            border: 2px solid var(--primary-color);
            background: #eef5fc;
            color: #333;
            font-weight: 500;
            box-shadow: 0 4px 8px rgba(74, 144, 226, 0.2);
            cursor: pointer;
        }

        /* 拖曳滑過座位時的視覺效果 */
        .seat.drag-over {
            background: #d4e6f7;
            border-color: var(--primary-color);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>未分配賓客</h3>
        <div class="guest-list" id="guestList">
            </div>
    </div>

    <div id="canvas" id="canvasLayout">
        </div>

    <script>
        // 1. 初始化資料：賓客名單與桌子設定
        const guests = [
            { id: "g1", name: "王大明" }, { id: "g2", name: "陳小美" },
            { id: "g3", name: "張三峰" }, { id: "g4", name: "李四端" },
            { id: "g5", name: "林心如" }, { id: "g6", name: "趙又廷" },
            { id: "g7", name: "許瑋甯" }, { id: "g8", name: "彭于晏" }
        ];

        const tables = [
            { id: "t1", name: "主桌", type: "main", seatCount: 10 },
            { id: "t2", name: "男方親友 1", type: "normal", seatCount: 8 },
            { id: "t3", name: "女方同學 1", type: "normal", seatCount: 8 }
        ];

        // 追蹤目前拖拽的賓客 ID
        let draggedGuestId = null;

        // 2. 初始化渲染
        function init() {
            renderGuests();
            renderTables();
        }

        // 渲染左側名單
        function renderGuests() {
            const listEl = document.getElementById('guestList');
            listEl.innerHTML = '';
            guests.forEach(guest => {
                const item = document.createElement('div');
                item.className = 'guest-item';
                item.draggable = true;
                item.innerText = guest.name;
                item.dataset.id = guest.id;

                // 綁定拖曳開始事件
                item.addEventListener('dragstart', (e) => {
                    draggedGuestId = guest.id;
                    e.dataTransfer.setData('text/plain', guest.id);
                });

                listEl.appendChild(item);
            });
        }

        // 渲染右側圓桌與座位（包含幾何角度計算）
        function renderTables() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';

            tables.forEach(table => {
                // 建立桌子容器
                const container = document.createElement('div');
                container.className = 'table-container';

                // 建立中央圓桌
                const center = document.createElement('div');
                center.className = `table-center ${table.type === 'main' ? 'main-table' : 'normal-table'}`;
                center.innerText = table.name;
                container.appendChild(center);

                // 計算並放置座位
                const radius = 105; // 座位中心點距離圓心的半徑 (px)
                const totalSeats = table.seatCount;

                for (let i = 0; i < totalSeats; i++) {
                    const seat = document.createElement('div');
                    seat.className = 'seat';
                    seat.innerText = '空';
                    seat.dataset.tableId = table.id;
                    seat.dataset.seatIndex = i;

                    // 使用三角函數計算每個座位的 X, Y 座標
                    // 減去 90 度 (Math.PI / 2) 是為了讓第一個座位從正上方開始排列
                    const angle = (i * 2 * Math.PI / totalSeats) - (Math.PI / 2);
                    
                    // 容器中心點是 (150, 150)，因為容器是 300x300
                    // 減去 27.5 是因為座位自身寬度為 55px，扣除半徑才能精準置中
                    const x = 150 + radius * Math.cos(angle) - 27.5;
                    const y = 150 + radius * Math.sin(angle) - 27.5;

                    seat.style.left = `${x}px`;
                    seat.style.top = `${y}px`;

                    // 綁定拖曳與放置事件
                    setupSeatEvents(seat);

                    container.appendChild(seat);
                }

                canvas.appendChild(container);
            });
        }

        // 3. 處理拖曳放置邏輯
        function setupSeatEvents(seat) {
            // 當物件拖過座位上方
            seat.addEventListener('dragover', (e) => {
                e.preventDefault(); // 必須阻擋預設行為，否則 drop 不會觸發
                if (!seat.classList.contains('occupied')) {
                    seat.classList.add('drag-over');
                }
            });

            // 當物件離開座位上方
            seat.addEventListener('dragleave', () => {
                seat.classList.remove('drag-over');
            });

            // 當放開滑鼠（放下賓客）
            seat.addEventListener('drop', (e) => {
                e.preventDefault();
                seat.classList.remove('drag-over');

                if (seat.classList.contains('occupied')) return; // 如果有人的話就不能放

                const guestId = e.dataTransfer.getData('text/plain');
                const guestIndex = guests.findIndex(g => g.id === guestId);
                
                if (guestIndex !== -1) {
                    const guestName = guests[guestIndex].name;

                    // 更新座位視覺狀態
                    seat.innerText = guestName;
                    seat.classList.add('occupied');

                    // 從左側陣列移除該名單並重新渲染名單
                    guests.splice(guestIndex, 1);
                    renderGuests();
                }
            });

            // 點擊已入座的座位，可以把人退回左側名單
            seat.addEventListener('click', () => {
                if (seat.classList.contains('occupied')) {
                    const retiredGuestName = seat.innerText;
                    const newId = 'g_' + Date.now(); // 產生隨機 ID

                    // 放回賓客陣列
                    guests.push({ id: newId, name: retiredGuestName });
                    
                    // 還原座位狀態
                    seat.innerText = '空';
                    seat.classList.remove('occupied');

                    // 重新渲染左側名單
                    renderGuests();
                }
            });
        }

        // 啟動程式
        window.onload = init;
    </script>
</body>
</html>
